<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Админ-панель</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="cabinet.html">
            Конференции
        </a>

        <div>
            <a href="ccreate.html" class="btn btn-primary">
                Создать заявку
            </a>
        </div>

    </div>
</nav>


<div class="container mt-4">

    <h2>Админ-панель</h2>

    <p>Все заявки пользователей</p>

    <!-- сообщение -->
    <div id="statusAlert" class="alert alert-success d-none">
        Статус заявки успешно изменён!
    </div>


    <!-- таблица -->
    <div class="card shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-hover">

                    <thead>
                        <tr>
                            <th>№</th>
                            <th>Пользователь</th>
                            <th>Помещение</th>
                            <th>Дата начала</th>
                            <th>Способ оплаты</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>

                    <tbody id="applicationsBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

let applications = JSON.parse(localStorage.getItem("applications"));

// если заявок ещё нет
if (!applications) {

    applications = [

        {
            id: 1,
            user: "Иванов Иван Иванович",
            room: "Конференц-зал «Альфа»",
            date: "15.10.2026",
            payment: "Очное посещение",
            status: "Новая"
        },

        {
            id: 2,
            user: "Петрова Анна Сергеевна",
            room: "Аудитория 305",
            date: "22.10.2026",
            payment: "Перевод по системе СБП",
            status: "Мероприятие назначено"
        },

        {
            id: 3,
            user: "Сидоров Пётр Алексеевич",
            room: "Зал «Бета»",
            date: "01.11.2026",
            payment: "Очное посещение",
            status: "Завершено"
        }

    ];

    localStorage.setItem(
        "applications",
        JSON.stringify(applications)
    );
}



function getStatusBadgeClass(status) {

    if (status == "Новая") {
        return "bg-primary";
    }

    if (status == "Мероприятие назначено") {
        return "bg-warning text-dark";
    }

    if (status == "Завершено") {
        return "bg-success";
    }

    return "bg-secondary";
}


// вывод заявки
function renderApplications() {

    let tbody = document.getElementById("applicationsBody");

    tbody.innerHTML = "";


    applications.forEach(function(app, index) {

        let row = document.createElement("tr");


        row.innerHTML = `

            <td>
                ${index + 1}
            </td>

            <td>
                ${app.user}
            </td>

            <td>
                ${app.room}
            </td>

            <td>
                ${app.date}
            </td>

            <td>
                ${app.payment}
            </td>

            <td>

                <span class="badge ${getStatusBadgeClass(app.status)}">
                    ${app.status}
                </span>

            </td>

            <td>

                <select
                    class="form-select form-select-sm status-select"
                    data-id="${app.id}"
                >

                    <option value="Новая"
                        ${app.status == "Новая" ? "selected" : ""}>
                        Новая
                    </option>

                    <option value="Мероприятие назначено"
                        ${app.status == "Мероприятие назначено" ? "selected" : ""}>
                        Мероприятие назначено
                    </option>

                    <option value="Завершено"
                        ${app.status == "Завершено" ? "selected" : ""}>
                        Завершено
                    </option>

                </select>

            </td>

        `;


        tbody.appendChild(row);

    });


    // обработчик изменения статуса

    document.querySelectorAll(".status-select").forEach(function(select) {

        select.addEventListener("change", changeStatus);

    });

}


// изменение статуса
function changeStatus(event) {

    let id = Number(event.target.dataset.id);

    let newStatus = event.target.value;


    // находим заявку

    let application = applications.find(function(app) {

        return app.id == id;

    });


    if (application) {

        // смена статуса

        application.status = newStatus;


        // сохранение

        localStorage.setItem(
            "applications",
            JSON.stringify(applications)
        );


        // обновление таблицы

        renderApplications();


        // сообщение

        let alert = document.getElementById("statusAlert");

        alert.classList.remove("d-none");


        // скрыть

        setTimeout(function() {

            alert.classList.add("d-none");

        }, 2000);

    }

}


//заявки при загрузке страницы

renderApplications();

</script>

</body>
</html>
