<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои заявки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Конференции</a>
        <div>
            <a href="ccreate.html" class="btn btn-primary">Создать заявку</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Мои заявки</h2>

    <table class="table table-striped table-hover mt-3">
        <thead>
            <tr>
                <th>№</th>
                <th>Помещение</th>
                <th>Дата начала</th>
                <th>Способ оплаты</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="applications"></tbody>
    </table>
</div>

<!-- Окно отзыва -->
<div class="modal fade" id="reviewModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Оставить отзыв</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <label class="form-label">Оценка</label>
                <select id="rating" class="form-select mb-3">
                    <option value="">Выберите оценку</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                </select>

                <label class="form-label">Комментарий</label>
                <textarea id="comment" class="form-control"></textarea>
            </div>

            <div class="modal-footer">
                <button class="btn btn-primary" onclick="sendReview()">Отправить отзыв</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
let applications = JSON.parse(localStorage.getItem("applications"));

if (!applications) {
    applications = [
        {
            room: "Конференц-зал №1",
            date: "15.10.2026",
            payment: "Перевод по системе СБП",
            status: "Проведена"
        },
        {
            room: "Зал №2",
            date: "20.10.2026",
            payment: "Очное посещение",
            status: "На рассмотрении"
        }
    ];
}

let selectedApplication = 0;

function showApplications() {
    let table = document.getElementById("applications");
    table.innerHTML = "";

    applications.forEach(function(application, index) {

        let status;

        if (application.status == "Проведена") {
            status = '<span class="badge bg-success">Проведена</span>';
        } else if (application.status == "На рассмотрении") {
            status = '<span class="badge bg-warning text-dark">На рассмотрении</span>';
        } else {
            status = '<span class="badge bg-danger">Отклонена</span>';
        }

        let button = "";

        if (application.status == "Проведена") {
            button = '<button class="btn btn-sm btn-primary" onclick="openReview(' + index + ')">Оставить отзыв</button>';
        }

        table.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${application.room}</td>
                <td>${application.date}</td>
                <td>${application.payment}</td>
                <td>${status}</td>
                <td>${button}</td>
            </tr>
        `;
    });
}

function openReview(index) {
    selectedApplication = index;

    let modal = new bootstrap.Modal(document.getElementById("reviewModal"));
    modal.show();
}

function sendReview() {
    let rating = document.getElementById("rating").value;
    let comment = document.getElementById("comment").value;

    if (rating == "") {
        alert("Выберите оценку");
        return;
    }

    applications[selectedApplication].review = {
        rating: rating,
        comment: comment
    };

    localStorage.setItem("applications", JSON.stringify(applications));

    alert("Спасибо! Отзыв отправлен.");

    location.reload();
}

showApplications();
</script>

</body>
</html>
