<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Создать заявку</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Конференции</a>
        <a href="cabinet.html" class="btn btn-primary">Мои заявки</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <h2>Формирование заявки</h2>

            <div id="message"></div>

            <form id="form" class="mt-3">

                <div class="mb-3">
                    <label class="form-label">Помещение</label>
                    <input type="text" id="room" class="form-control"
                           minlength="3" required>
                    <div class="invalid-feedback">
                        Укажите помещение, минимум 3 символа.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Дата начала конференции</label>
                    <input type="text" id="date" class="form-control"
                           placeholder="ДД.ММ.ГГГГ" required>
                    <div class="form-text">Например: 25.10.2026</div>
                    <div class="invalid-feedback">
                        Укажите дату.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Способ оплаты</label>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="payment" value="Очное посещение" required>
                        <label class="form-check-label">
                            Очное посещение
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio"
                               name="payment" value="Перевод по системе СБП">
                        <label class="form-check-label">
                            Перевод по системе СБП
                        </label>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit">
                    Отправить
                </button>

            </form>
        </div>
    </div>
</div>

<script>
let form = document.getElementById("form");

form.addEventListener("submit", function(event) {

    event.preventDefault();

    if (!form.checkValidity()) {
        form.classList.add("was-validated");
        return;
    }

    let applications = JSON.parse(localStorage.getItem("applications")) || [];

    let payment = document.querySelector('input[name="payment"]:checked').value;

    let newApplication = {
        room: document.getElementById("room").value,
        date: document.getElementById("date").value,
        payment: payment,
        status: "На рассмотрении"
    };

    applications.push(newApplication);

    localStorage.setItem("applications", JSON.stringify(applications));

    document.getElementById("message").innerHTML =
        '<div class="alert alert-success">Заявка успешно отправлена!</div>';

    form.reset();

    setTimeout(function() {
        window.location.href = "index.html";
    }, 1000);
});
</script>

</body>
</html>
